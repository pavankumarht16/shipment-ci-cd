name: Shipment CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # =========================
  # BACKEND CI
  # =========================
  backend-test:

    name: Backend - Test and Validate

    permissions:
      contents: read

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shipment_ci_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d shipment_ci_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shipment_ci_test

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shipment_ci_test

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shipment_ci_test


  # =========================
  # FRONTEND CI
  # =========================
  frontend-test:

    name: Frontend - Test and Validate

    permissions:
      contents: read

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build


  # =========================
  # DOCKER + BTP DELIVERY
  # =========================
  delivery:

    name: CD - Build, Publish and Deploy to BTP

    needs:
      - backend-test
      - frontend-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-latest

    steps:

      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================
      # GHCR LOGIN
      # =========================
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # =========================
      # BACKEND IMAGE
      # =========================
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}


      # =========================
      # FRONTEND IMAGE
      # =========================
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=https://shipment-backend.cfapps.us10-001.hana.ondemand.com/api
          tags: |
            ghcr.io/${{ github.repository }}-frontend:latest
            ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}


      # =========================
      # INSTALL CF CLI
      # =========================
      - name: Install Cloud Foundry CLI
        run: |
          curl -L "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v8" \
            -o cf-cli.tgz
          tar -xzf cf-cli.tgz
          sudo mv cf8 /usr/local/bin/cf
          cf --version


      # =========================
      # LOGIN TO SAP BTP
      # =========================
      - name: Login to SAP BTP
        run: |
          cf api "${{ secrets.CF_API }}"
          cf auth "${{ secrets.CF_USERNAME }}" "${{ secrets.CF_PASSWORD }}"
          cf target \
            -o "${{ secrets.CF_ORG }}" \
            -s "${{ secrets.CF_SPACE }}"


      # =========================
      # DEPLOY BACKEND
      # =========================
      - name: Deploy backend to SAP BTP
        run: |
          cf push shipment-backend \
            --docker-image ghcr.io/${{ github.repository }}:${{ github.sha }}


      # =========================
      # RUN PRISMA MIGRATIONS
      # =========================
      - name: Run Prisma migrations
        shell: bash
        run: |
          TASK_NAME="prisma-migrate-${GITHUB_SHA}"

          cf run-task shipment-backend \
            --name "$TASK_NAME" \
            --command "cd /app && /app/node_modules/.bin/prisma migrate deploy"

          echo "Waiting for Prisma migration task..."

          for i in {1..30}; do

            TASK_ID=$(cf tasks shipment-backend | \
              awk -v name="$TASK_NAME" '$2 == name {print $1; exit}')

            if [ -n "$TASK_ID" ]; then
              break
            fi

            sleep 2
          done

          if [ -z "$TASK_ID" ]; then
            echo "Could not find migration task."
            exit 1
          fi

          echo "Migration task ID: $TASK_ID"

          for i in {1..60}; do

            STATE=$(cf task shipment-backend "$TASK_ID" | \
              awk -F': +' '/state:/ {print $2; exit}')

            echo "Migration state: $STATE"

            if [ "$STATE" = "SUCCEEDED" ]; then
              echo "Prisma migrations completed successfully."
              exit 0
            fi

            if [ "$STATE" = "FAILED" ]; then
              echo "Prisma migrations failed."
              cf logs shipment-backend --recent
              exit 1
            fi

            sleep 5

          done

          echo "Migration task timed out."
          exit 1


      # =========================
      # DEPLOY FRONTEND
      # =========================
      - name: Deploy frontend to SAP BTP
        run: |
          cf push shipment-frontend \
            --docker-image ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}


      # =========================
      # VERIFY DEPLOYMENTS
      # =========================
      - name: Verify BTP applications
        run: |
          cf apps